<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="{{ base }}/">
  <title>{{ title }} · Videoclube</title>
  <style>
    :root {
      --bg: #0b0d12; --bg2: #12151d; --card: #161a24; --line: #232838;
      --txt: #eef2f7; --muted: #97a2b6; --accent: #f5b32b; --accent2: #2d7ff9;
      --ok: #36d399; --warn: #fbbd23; --bad: #f87272;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           background: radial-gradient(1200px 600px at 70% -10%, #1a2336 0%, var(--bg) 55%); color: var(--txt); }
    a { color: inherit; text-decoration: none; }
    header.top { position: sticky; top: 0; z-index: 20; display: flex; gap: .8rem; align-items: center;
                 padding: .7rem 1rem; background: rgba(11,13,18,.85); backdrop-filter: blur(10px);
                 border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    .brand { font-weight: 800; letter-spacing: .5px; font-size: 1.15rem; display: flex; align-items: center; gap: .5rem; }
    .brand .dot { color: var(--accent); }
    nav.top { display: flex; gap: .3rem; flex-wrap: wrap; }
    nav.top a { padding: .45rem .7rem; border-radius: 9px; color: var(--muted); font-weight: 600; font-size: .9rem; }
    nav.top a:hover, nav.top a.active { background: var(--card); color: var(--txt); }
    .search { margin-left: auto; display: flex; gap: .4rem; }
    .search input { background: var(--bg2); border: 1px solid var(--line); color: var(--txt);
                    padding: .5rem .8rem; border-radius: 10px; min-width: 12rem; }
    main { padding: 1rem; max-width: 1500px; margin: 0 auto; }
    h1 { font-size: 1.4rem; margin: .2rem 0 1rem; }
    h2 { font-size: 1.1rem; margin: 1.5rem 0 .7rem; }
    .muted { color: var(--muted); }
    .btn { display: inline-flex; align-items: center; gap: .4rem; background: var(--accent); color: #1a1300;
           border: none; padding: .55rem .9rem; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: .9rem; }
    .btn:hover { filter: brightness(1.08); }
    .btn.ghost { background: transparent; color: var(--txt); border: 1px solid var(--line); }
    .btn.small { padding: .35rem .6rem; font-size: .8rem; }
    .chip { display: inline-block; padding: .2rem .55rem; border-radius: 999px; background: var(--bg2);
            border: 1px solid var(--line); color: var(--muted); font-size: .72rem; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
            display: flex; flex-direction: column; transition: transform .12s, box-shadow .12s; }
    .card:hover { transform: translateY(-4px); box-shadow: 0 12px 28px rgba(0,0,0,.45); }
    .poster { position: relative; aspect-ratio: 2/3; background: #0a0c10 center/cover no-repeat; }
    .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .poster .badge { position: absolute; top: .5rem; left: .5rem; background: rgba(0,0,0,.7); color: #fff;
                     font-size: .68rem; padding: .15rem .45rem; border-radius: 6px; }
    .poster .rate { position: absolute; top: .5rem; right: .5rem; background: rgba(0,0,0,.7); color: var(--accent);
                    font-weight: 700; font-size: .72rem; padding: .15rem .45rem; border-radius: 6px; }
    .cardbody { padding: .6rem .65rem .7rem; display: flex; flex-direction: column; gap: .35rem; flex: 1; }
    .cardtitle { font-weight: 700; font-size: .9rem; line-height: 1.2; }
    .cardmeta { color: var(--muted); font-size: .76rem; }
    .cardbody .btn { margin-top: auto; }

    .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: .7rem; }
    .tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: .9rem 1rem;
            display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
    .tile:hover { border-color: var(--accent); }
    .tile .n { font-size: 1.4rem; font-weight: 800; }

    .filters { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; }
    .filters select, .filters input { background: var(--bg2); border: 1px solid var(--line); color: var(--txt);
            padding: .45rem .6rem; border-radius: 9px; }
    .pager { display: flex; gap: .5rem; justify-content: center; align-items: center; margin: 1.5rem 0; }

    .detail { display: grid; grid-template-columns: 260px 1fr; gap: 1.5rem; }
    @media (max-width: 640px) { .detail { grid-template-columns: 1fr; } }
    .detail .poster { border-radius: 14px; border: 1px solid var(--line); }
    .season { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin: .6rem 0; }
    .season > summary { cursor: pointer; padding: .8rem 1rem; font-weight: 700; }
    .ep { display: flex; align-items: center; gap: .6rem; padding: .5rem 1rem; border-top: 1px solid var(--line); }
    .ep .epnum { color: var(--muted); font-size: .8rem; min-width: 3.2rem; }
    .ep .eptitle { flex: 1; font-size: .9rem; }

    .progress { height: 8px; background: var(--bg2); border-radius: 999px; overflow: hidden; }
    .progress > span { display: block; height: 100%; background: var(--accent); }
    .joblist { display: grid; gap: .7rem; }
    .job { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: .8rem 1rem; }
    .status { font-size: .78rem; font-weight: 700; }
    .status.completed { color: var(--ok); } .status.running { color: var(--accent); }
    .status.failed { color: var(--bad); } .status.queued { color: var(--muted); }

    #toast { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); background: var(--card);
             border: 1px solid var(--accent); color: var(--txt); padding: .7rem 1rem; border-radius: 12px;
             box-shadow: 0 8px 24px rgba(0,0,0,.5); opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; }
    #toast.show { opacity: 1; }
  </style>
</head>
<body data-refresh="{{ refresh|default(0) }}">
  <header class="top">
    <a class="brand" href="">🎬 <span>Video<span class="dot">·</span>Clube</span></a>
    <nav class="top">
      <a href="browse?type=movie" class="{{ 'active' if nav=='movies' }}">Filmes</a>
      <a href="browse?type=series" class="{{ 'active' if nav=='series' }}">Séries</a>
      <a href="categories" class="{{ 'active' if nav=='categories' }}">Categorias</a>
      <a href="downloads" class="{{ 'active' if nav=='downloads' }}">Alugados</a>
      <a href="storage" class="{{ 'active' if nav=='storage' }}">Espaço</a>
    </nav>
    <form class="search" method="get" action="browse">
      <input name="q" placeholder="Procurar título…" value="{{ q|default('') }}">
      <input type="hidden" name="type" value="{{ search_type|default('movie') }}">
    </form>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <div id="toast"></div>
  <script>
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2600);
    }
    // Rent without leaving the page (progressive enhancement; falls back to POST).
    document.addEventListener('submit', async (e) => {
      const f = e.target;
      if (!f.matches('form.rent')) return;
      e.preventDefault();
      const btn = f.querySelector('button');
      const label = btn.textContent;
      btn.disabled = true; btn.textContent = 'A alugar…';
      try {
        const res = await fetch(f.getAttribute('action'), { method: 'POST', body: new FormData(f) });
        if (!res.ok) throw new Error(await res.text());
        btn.textContent = '✓ Alugado'; toast('Adicionado aos alugados');
      } catch (err) {
        btn.disabled = false; btn.textContent = label; toast('Erro: ' + err.message);
      }
    });
    // Auto-refresh the downloads page while jobs are active.
    if (parseInt(document.body.dataset.refresh || '0', 10) > 0) {
      setTimeout(() => location.reload(), 4000);
    }
  </script>
</body>
</html>
