name: Plex M3U Manager
version: "0.2.14"
slug: plex_m3u_manager
description: Manage authorized M3U media downloads into Synology/Plex folders
url: https://github.com/ruipalm/ha-plex-m3u-manager
arch:
  - amd64
  - aarch64
  - armv7
startup: services
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:movie-open-cog
ports:
  8099/tcp: null
map:
  - share:rw
options:
  m3u_url: ""
  movies_path: "/share/plex_movies"
  series_path: "/share/plex_series"
  user_agent: "VLC/3.0.20 LibVLC/3.0.20"
  tmdb_api_key: ""
  tmdb_language: "pt-PT"
  page_size: 60
  exclude_groups: "★,●,adult,xxx,porn,+18,18+"
schema:
  m3u_url: str
  movies_path: str
  series_path: str
  user_agent: str?
  tmdb_api_key: str?
  tmdb_language: str?
  page_size: int(12,200)?
  exclude_groups: str?
